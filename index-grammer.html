<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch Grammar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .card {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 18px;
            width: 340px;
            text-align: center;
            border-top: 4px solid #107c10; /* Green to differentiate */
            cursor: grab;
        }

        .card:active { cursor: grabbing; }

        .drag-handle {
            text-align: center;
            color: #ccc;
            font-size: 1em;
            margin-bottom: 8px;
        }

        .topic {
            font-size: 1.3em;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .pattern {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 12px;
            font-style: italic;
        }

        .example {
            text-align: left;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.82em;
            color: #333;
            line-height: 1.4;
            border-left: 3px solid #107c10;
            margin-bottom: 8px;
        }

        .note {
            background: #fff3cd;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75em;
            color: #856404;
            margin-top: 10px;
            text-align: left;
        }

        .highlight {
            color: #107c10;
            font-weight: bold;
        }

        button {
            background-color: #107c10;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 0.85em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 8px;
        }

        button:hover { background-color: #0b5a0b; }

        .topic, .pattern, .example, .note {
            transition: opacity 0.4s ease-in-out;
        }
        .fade-out { opacity: 0; }
    </style>
</head>
<body>

    <div class="card" id="draggable-card">
        <div class="drag-handle">⋮⋮</div>
        <div class="topic" id="topic"></div>
        <div class="pattern" id="pattern"></div>
        <div class="example" id="ex1"></div>
        <div class="example" id="ex2"></div>
        <div class="example" id="ex3"></div>
        <div class="note" id="note"></div>
        <button onclick="showRandomGrammar()">Nächstes Thema ➔</button>
    </div>

    <script src="grammar.js"></script>
    
    <script>
        const card = document.getElementById('draggable-card');
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        card.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            const rect = card.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            card.style.left = `${initialLeft + e.clientX - startX}px`;
            card.style.top = `${initialTop + e.clientY - startY}px`;
        });

        document.addEventListener('mouseup', () => { isDragging = false; });

        function showRandomGrammar() {
            const elements = document.querySelectorAll('.topic, .pattern, .example, .note');
            elements.forEach(el => el.classList.add('fade-out'));

            setTimeout(() => {
                const item = grammar[Math.floor(Math.random() * grammar.length)];
                document.getElementById('topic').textContent = item.topic;
                document.getElementById('pattern').textContent = item.pattern;
                document.getElementById('ex1').innerHTML = "💬 " + item.examples[0];
                document.getElementById('ex2').innerHTML = "💬 " + item.examples[1];
                document.getElementById('ex3').innerHTML = "💬 " + item.examples[2];
                document.getElementById('note').innerHTML = "💡 " + item.note;
                elements.forEach(el => el.classList.remove('fade-out'));
            }, 400);
        }

        showRandomGrammar();
        setInterval(showRandomGrammar, 180000); // 3 minutes for grammar
    </script>
</body>
</html>
