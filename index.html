<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office German Vocab Tile</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            padding: 30px 35px;
            max-width: 580px;
            width: 95%;
            text-align: center;
            border-top: 6px solid #0078d4;
        }
        .source {
            font-size: 0.8em;
            color: #999;
            margin-bottom: 12px;
            font-weight: 500;
            transition: opacity 0.6s ease-in-out;
        }
        .word {
            font-size: 2.4em;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 8px;
            transition: opacity 0.6s ease-in-out;
        }
        .meaning {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 22px;
            font-style: italic;
            transition: opacity 0.6s ease-in-out;
        }
        .examples {
            text-align: left;
            background-color: #f8f9fa;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 22px;
            border-left: 4px solid #0078d4;
        }
        .example {
            margin-bottom: 12px;
            font-size: 1em;
            color: #333;
            line-height: 1.5;
            transition: opacity 0.6s ease-in-out;
        }
        .example:last-child {
            margin-bottom: 0;
        }
        .highlight {
            color: #0078d4;
            font-weight: bold;
        }
        .fade-out {
            opacity: 0;
        }
        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-weight: 600;
        }
        button:hover {
            background-color: #005a9e;
        }
        button:active {
            transform: scale(0.98);
        }
        .counter {
            font-size: 0.75em;
            color: #bbb;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="source" id="source"></div>
        <div class="word" id="word"></div>
        <div class="meaning" id="meaning"></div>
        <div class="examples">
            <div class="example" id="ex1"></div>
            <div class="example" id="ex2"></div>
        </div>
        <button onclick="showRandomWord()">Nächstes Wort ➔</button>
        <div class="counter" id="counter"></div>
    </div>

    <script src="vocab.js"></script>

    <script>
        let lastIndex = -1;

        function showRandomWord() {
            const elements = document.querySelectorAll('.source, .word, .meaning, .example');

            // Fade out
            elements.forEach(el => el.classList.add('fade-out'));

            // After fade-out finishes, change content and fade in
            setTimeout(() => {
                // Pick a random index, but avoid repeating the same word twice in a row
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * vocab.length);
                } while (randomIndex === lastIndex && vocab.length > 1);
                lastIndex = randomIndex;

                const item = vocab[randomIndex];

                document.getElementById('source').textContent = "📖 " + item.source;
                document.getElementById('word').textContent = item.word;
                document.getElementById('meaning').textContent = item.meaning;
                document.getElementById('ex1').innerHTML = "💬 " + item.ex1;
                document.getElementById('ex2').innerHTML = "💬 " + item.ex2;
                document.getElementById('counter').textContent = (randomIndex + 1) + " / " + vocab.length;

                // Fade in
                elements.forEach(el => el.classList.remove('fade-out'));
            }, 600);
        }

        // Show first word immediately
        showRandomWord();

        // Auto-change every 2 minutes (120000 ms)
        setInterval(showRandomWord, 120000);
    </script>
</body>
</html>
