<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch Tile</title>
    <style>
        /* Transparent background so it floats on your desktop */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent; 
            margin: 0;
            height: 100vh;
            overflow: hidden; /* Prevents scrollbars when dragging */
            user-select: none; /* Prevents highlighting text while dragging */
        }

        .card {
            position: absolute;
            top: 20px;       /* Default: Top of screen */
            left: 20px;      /* Default: Left of screen */
            background: rgba(255, 255, 255, 0.95); /* Slight transparency */
            backdrop-filter: blur(10px); /* Frosted glass effect (Windows 11 style) */
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            padding: 30px;
            width: 550px;
            text-align: center;
            border-top: 6px solid #0078d4;
            cursor: grab; /* Shows the "hand" cursor */
            transition: box-shadow 0.2s, transform 0.1s;
        }

        .card:active {
            cursor: grabbing;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        }

        /* The little grip handle at the top to show it's moveable */
        .drag-handle {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            color: #aaa;
            font-size: 1.2em;
            letter-spacing: 2px;
        }

        .source {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .word {
            font-size: 2.2em;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .meaning {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 25px;
            font-style: italic;
        }

        .examples {
            text-align: left;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #0078d4;
        }

        .example {
            margin-bottom: 12px;
            font-size: 1em;
            color: #333;
            line-height: 1.5;
        }

        .example:last-child { margin-bottom: 0; }

        .highlight {
            color: #0078d4;
            font-weight: bold;
        }

        /* Smooth fade effect for auto-changing */
        .source, .word, .meaning, .example {
            transition: opacity 0.5s ease-in-out;
        }
        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="card" id="draggable-card">
        <div class="drag-handle">⋮⋮</div> <!-- Grip handle -->
        <div class="source" id="source"></div>
        <div class="word" id="word"></div>
        <div class="meaning" id="meaning"></div>
        <div class="examples">
            <div class="example" id="ex1"></div>
            <div class="example" id="ex2"></div
        </div>
    </div>

    <!-- Links to your external data file -->
    <script src="vocab.js"></script>
    
    <script>
        // --- 1. DRAGGABLE WIDGET LOGIC ---
        const card = document.getElementById('draggable-card');
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        card.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            const rect = card.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            card.style.left = `${initialLeft + dx}px`;
            card.style.top = `${initialTop + dy}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // --- 2. VOCAB LOGIC ---
        function showRandomWord() {
            const elements = document.querySelectorAll('.source, .word, .meaning, .example');
            
            // Fade out
            elements.forEach(el => el.classList.add('fade-out'));

            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * vocab.length);
                const item = vocab[randomIndex];

                document.getElementById('source').textContent = "📖 " + item.source;
                document.getElementById('word').textContent = item.word;
                document.getElementById('meaning').textContent = item.meaning;
                document.getElementById('ex1').innerHTML = "💬 " + item.ex1;
                document.getElementById('ex2').innerHTML = "💬 " + item.ex2;

                // Fade in
                elements.forEach(el => el.classList.remove('fade-out'));
            }, 500); 
        }

        // Start immediately and set 2-minute interval
        showRandomWord();
        setInterval(showRandomWord, 120000);
    </script>
</body>
</html>
