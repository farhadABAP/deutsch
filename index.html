<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .card {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 18px;
            width: 340px;
            height: 480px;
            text-align: center;
            cursor: grab;
            display: flex;
            flex-direction: column;
        }

        .card:active { cursor: grabbing; }

        .vocab-card {
            top: 20px;
            left: 20px;
            border-top: 4px solid #0078d4;
        }

        .grammar-card {
            top: 20px;
            left: 380px;
            border-top: 4px solid #107c10;
        }

        .news-card {
            top: 20px;
            left: 740px;
            border-top: 4px solid #d83b01;
        }

        .drag-handle {
            text-align: center;
            color: #ccc;
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .word, .topic, .headline {
            font-size: 1.3em;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .meaning, .pattern {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 10px;
            font-style: italic;
        }

        .example {
            text-align: left;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.78em;
            color: #333;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .vocab-card .example { border-left: 3px solid #0078d4; }
        .grammar-card .example { border-left: 3px solid #107c10; }
        .news-card .example { border-left: 3px solid #d83b01; }

        .note {
            background: #fff3cd;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.72em;
            color: #856404;
            margin-top: auto;
            text-align: left;
        }

        .date {
            font-size: 0.72em;
            color: #999;
            margin-bottom: 8px;
        }

        .vocab-card .highlight { color: #0078d4; font-weight: bold; }
        .grammar-card .highlight { color: #107c10; font-weight: bold; }
        .news-card .highlight { color: #d83b01; font-weight: bold; }

        button {
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 0.85em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: auto;
        }

        .vocab-card button { background-color: #0078d4; }
        .vocab-card button:hover { background-color: #005a9e; }

        .grammar-card button { background-color: #107c10; }
        .grammar-card button:hover { background-color: #0b5a0b; }

        .news-card button { background-color: #d83b01; }
        .news-card button:hover { background-color: #a52d00; }

        .word, .meaning, .example, .topic, .pattern, .note, .headline, .date {
            transition: opacity 0.4s ease-in-out;
        }
        .fade-out { opacity: 0; }

        /* Two words side by side */
        .vocab-container {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .vocab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <!-- VOCAB CARD - NOW WITH TWO WORDS -->
    <div class="card vocab-card" id="vocab-card">
        <div class="drag-handle">⋮⋮ VOCAB ⋮⋮</div>
        <div class="vocab-container">
            <div class="vocab-item">
                <div class="word" id="word1"></div>
                <div class="meaning" id="meaning1"></div>
                <div class="example" id="vocab1-ex1"></div>
                <div class="example" id="vocab1-ex2"></div>
            </div>
            <div class="vocab-item">
                <div class="word" id="word2"></div>
                <div class="meaning" id="meaning2"></div>
                <div class="example" id="vocab2-ex1"></div>
                <div class="example" id="vocab2-ex2"></div>
            </div>
        </div>
        <button onclick="showRandomWords()">Nächste Wörter ➔</button>
    </div>

    <!-- GRAMMAR CARD -->
    <div class="card grammar-card" id="grammar-card">
        <div class="drag-handle">⋮⋮ GRAMMAR ⋮⋮</div>
        <div class="topic" id="topic"></div>
        <div class="pattern" id="pattern"></div>
        <div class="example" id="grammar-ex1"></div>
        <div class="example" id="grammar-ex2"></div>
        <div class="example" id="grammar-ex3"></div>
        <div class="note" id="note"></div>
        <button onclick="showRandomGrammar()">Nächstes Thema ➔</button>
    </div>

    <!-- NEWS CARD - LIVE RSS FEED -->
    <div class="card news-card" id="news-card">
        <div class="drag-handle">⋮⋮ NACHRICHTEN ⋮⋮</div>
        <div class="date" id="news-date"></div>
        <div class="headline" id="headline"></div>
        <div class="example" id="news-summary"></div>
        <button onclick="showNextNews()">Nächste Meldung ➔</button>
    </div>

    <script src="vocab.js"></script>
    <script src="grammar.js"></script>
    
    <script>
        // Make all cards draggable
        function makeDraggable(card) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            card.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                const rect = card.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                card.style.left = `${initialLeft + e.clientX - startX}px`;
                card.style.top = `${initialTop + e.clientY - startY}px`;
            });

            document.addEventListener('mouseup', () => { isDragging = false; });
        }

        makeDraggable(document.getElementById('vocab-card'));
        makeDraggable(document.getElementById('grammar-card'));
        makeDraggable(document.getElementById('news-card'));

        // VOCAB - Show 2 words at once
        function showRandomWords() {
            const elements = document.querySelectorAll('.vocab-card .word, .vocab-card .meaning, .vocab-card .example');
            elements.forEach(el => el.classList.add('fade-out'));

            setTimeout(() => {
                // Pick 2 different random words
                const index1 = Math.floor(Math.random() * vocab.length);
                let index2 = Math.floor(Math.random() * vocab.length);
                while (index2 === index1) {
                    index2 = Math.floor(Math.random() * vocab.length);
                }

                const item1 = vocab[index1];
                const item2 = vocab[index2];

                document.getElementById('word1').textContent = item1.word;
                document.getElementById('meaning1').textContent = item1.meaning;
                document.getElementById('vocab1-ex1').innerHTML = "💬 " + item1.ex1;
                document.getElementById('vocab1-ex2').innerHTML = "💬 " + item1.ex2;

                document.getElementById('word2').textContent = item2.word;
                document.getElementById('meaning2').textContent = item2.meaning;
                document.getElementById('vocab2-ex1').innerHTML = "💬 " + item2.ex1;
                document.getElementById('vocab2-ex2').innerHTML = "💬 " + item2.ex2;

                elements.forEach(el => el.classList.remove('fade-out'));
            }, 400);
        }

        // GRAMMAR
        function showRandomGrammar() {
            const elements = document.querySelectorAll('.grammar-card .topic, .grammar-card .pattern, .grammar-card .example, .grammar-card .note');
            elements.forEach(el => el.classList.add('fade-out'));

            setTimeout(() => {
                const item = grammar[Math.floor(Math.random() * grammar.length)];
                document.getElementById('topic').textContent = item.topic;
                document.getElementById('pattern').textContent = item.pattern;
                document.getElementById('grammar-ex1').innerHTML = "💬 " + item.examples[0];
                document.getElementById('grammar-ex2').innerHTML = "💬 " + item.examples[1];
                document.getElementById('grammar-ex3').innerHTML = "💬 " + item.examples[2];
                document.getElementById('note').innerHTML = "💡 " + item.note;
                elements.forEach(el => el.classList.remove('fade-out'));
            }, 400);
        }

        // NEWS - Fetch from Tagesschau RSS
        let newsItems = [];
        let currentNewsIndex = 0;

        async function fetchNews() {
            try {
                // Using a CORS proxy to fetch RSS
                const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.tagesschau.de/xml/rss2/'));
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const items = xml.querySelectorAll('item');

                newsItems = Array.from(items).slice(0, 10).map(item => ({
                    date: item.querySelector('pubDate')?.textContent || '',
                    headline: item.querySelector('title')?.textContent || '',
                    summary: item.querySelector('description')?.textContent || ''
                }));

                if (newsItems.length > 0) {
                    showNextNews();
                }
            } catch (error) {
                console.error('Error fetching news:', error);
                // Fallback to static news if RSS fails
                document.getElementById('headline').textContent = 'Nachrichten nicht verfügbar';
                document.getElementById('news-summary').innerHTML = '📰 RSS-Feed konnte nicht geladen werden';
            }
        }

        function showNextNews() {
            if (newsItems.length === 0) return;

            const elements = document.querySelectorAll('.news-card .headline, .news-card .example, .news-card .date');
            elements.forEach(el => el.classList.add('fade-out'));

            setTimeout(() => {
                const item = newsItems[currentNewsIndex];
                document.getElementById('news-date').textContent = new Date(item.date).toLocaleDateString('de-DE');
                document.getElementById('headline').textContent = item.headline;
                document.getElementById('news-summary').innerHTML = "📰 " + item.summary;
                
                currentNewsIndex = (currentNewsIndex + 1) % newsItems.length;
                elements.forEach(el => el.classList.remove('fade-out'));
            }, 400);
        }

        // Initialize
        showRandomWords();
        showRandomGrammar();
        fetchNews(); // Fetch live news

        // Auto-change timers
        setInterval(showRandomWords, 120000);      // Vocab: 2 minutes
        setInterval(showRandomGrammar, 180000);   // Grammar: 3 minutes
        setInterval(showNextNews, 240000);        // News: 4 minutes
    </script>
</body>
</html>
