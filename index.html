<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch Tile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .card {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 20px;
            width: 320px; /* Much smaller! */
            text-align: center;
            border-top: 4px solid #0078d4;
            cursor: grab;
        }

        .card:active {
            cursor: grabbing;
        }

        .drag-handle {
            text-align: center;
            color: #ccc;
            font-size: 1em;
            margin-bottom: 10px;
        }

        .word {
            font-size: 1.6em;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .meaning {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
        }

        .example {
            text-align: left;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85em;
            color: #333;
            line-height: 1.4;
            border-left: 3px solid #0078d4;
        }

        .highlight {
            color: #0078d4;
            font-weight: bold;
        }

        .source, .word, .meaning, .example {
            transition: opacity 0.4s ease-in-out;
        }
        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="card" id="draggable-card">
        <div class="drag-handle">⋮⋮</div>
        <div class="word" id="word"></div>
        <div class="meaning" id="meaning"></div>
        <div class="example" id="ex1"></div>
    </div>

    <script src="vocab.js"></script>
    
    <script>
        // Drag logic
        const card = document.getElementById('draggable-card');
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        card.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            const rect = card.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            card.style.left = `${initialLeft + dx}px`;
            card.style.top = `${initialTop + dy}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Vocab logic - simplified
        function showRandomWord() {
            const elements = document.querySelectorAll('.word, .meaning, .example');
            elements.forEach(el => el.classList.add('fade-out'));

            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * vocab.length);
                const item = vocab[randomIndex];

                document.getElementById('word').textContent = item.word;
                document.getElementById('meaning').textContent = item.meaning;
                document.getElementById('ex1').innerHTML = "💬 " + item.ex1;

                elements.forEach(el => el.classList.remove('fade-out'));
            }, 400);
        }

        showRandomWord();
        setInterval(showRandomWord, 120000);
    </script>
</body>
</html>
