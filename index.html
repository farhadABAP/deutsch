<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch Tile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .card {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 18px;
            width: 340px;
            text-align: center;
            border-top: 4px solid #0078d4;
            cursor: grab;
        }

        .card:active { cursor: grabbing; }

        .drag-handle {
            text-align: center;
            color: #ccc;
            font-size: 1em;
            margin-bottom: 8px;
        }

        .word {
            font-size: 1.5em;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .meaning {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 12px;
            font-style: italic;
        }

        .example {
            text-align: left;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.82em;
            color: #333;
            line-height: 1.4;
            border-left: 3px solid #0078d4;
            margin-bottom: 8px;
        }

        .highlight {
            color: #0078d4;
            font-weight: bold;
        }

        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 0.85em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 5px;
        }

        button:hover { background-color: #005a9e; }

        .word, .meaning, .example {
            transition: opacity 0.4s ease-in-out;
        }
        .fade-out { opacity: 0; }
    </style>
</head>
<body>

    <div class="card" id="draggable-card">
        <div class="drag-handle">⋮⋮</div>
        <div class="word" id="word"></div>
        <div class="meaning" id="meaning"></div>
        <div class="example" id="ex1"></div>
        <div class="example" id="ex2"></div>
        <button onclick="showRandomWord()">Nächstes Wort ➔</button>
    </div>

    <script src="vocab.js"></script>
    
    <script>
        const card = document.getElementById('draggable-card');
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        card.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            const rect = card.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            card.style.left = `${initialLeft + e.clientX - startX}px`;
            card.style.top = `${initialTop + e.clientY - startY}px`;
        });

        document.addEventListener('mouseup', () => { isDragging = false; });

        function showRandomWord() {
            const elements = document.querySelectorAll('.word, .meaning, .example');
            elements.forEach(el => el.classList.add('fade-out'));

            setTimeout(() => {
                const item = vocab[Math.floor(Math.random() * vocab.length)];
                document.getElementById('word').textContent = item.word;
                document.getElementById('meaning').textContent = item.meaning;
                document.getElementById('ex1').innerHTML = "💬 " + item.ex1;
                document.getElementById('ex2').innerHTML = "💬 " + item.ex2;
                elements.forEach(el => el.classList.remove('fade-out'));
            }, 400);
        }

        showRandomWord();
        setInterval(showRandomWord, 120000);
    </script>
</body>
</html>
